<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | SUHAS GROUP</title><link rel="stylesheet" href="assets/styles.css"><style>
body{background:#f2f5fa;color:#14233d}.wrap{max-width:920px;margin:30px auto;padding:0 16px}.hero{display:flex;gap:18px;align-items:center;padding:24px;border-radius:22px;color:white;background:linear-gradient(120deg,#071b3b,#174a9c);min-width:0}.avatar-wrap{flex:0 0 auto;text-align:center}.avatar{width:96px;height:96px;border:4px solid white;border-radius:50%;object-fit:cover;display:block}.photo-btn{margin-top:9px!important;padding:7px 12px!important;font-size:12px!important;line-height:1.2!important;min-height:0!important;border-radius:9px!important}.profile-summary{min-width:0;flex:1}.profile-name{margin:0 0 8px;font-size:clamp(27px,6vw,42px);line-height:1.08;font-weight:850;letter-spacing:-.035em;color:#ffe08a;text-shadow:0 2px 0 #7b4c10,0 5px 12px #0007;overflow-wrap:anywhere}.profile-meta-window{overflow:hidden;white-space:nowrap;margin:5px 0 8px;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}.profile-meta-track{display:inline-flex;align-items:center;gap:18px;width:max-content;animation:profileTicker 18s linear infinite}.profile-meta{font-size:clamp(14px,3.4vw,18px);font-weight:750}.profile-company{color:#ffd166}.profile-university{color:#9de7ff}.profile-separator{color:#fff;font-weight:700}.profile-bio{margin:8px 0 0;color:#e6eaf5;font-size:14px;line-height:1.5;font-weight:550;overflow-wrap:anywhere}.profile-bio:empty{display:none}@keyframes profileTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}.card{margin-top:18px;padding:25px;background:white;border:1px solid #e1e8f2;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7e0ec;border-radius:10px;font:inherit}.field.full{grid-column:1/-1}.req{color:#c33}.section{margin:22px 0 10px;color:#12366e}.msg{display:none;padding:12px;border-radius:10px;margin-bottom:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}@media(prefers-reduced-motion:reduce){.profile-meta-track{animation:none}}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{margin:18px auto}.hero{align-items:flex-start;padding:17px;gap:14px}.avatar{width:76px;height:76px}.photo-btn{padding:6px 9px!important;font-size:11px!important}.profile-name{font-size:clamp(25px,7vw,34px)}.profile-bio{font-size:12px}.card{padding:18px}}
</style></head><body><header class="site-header"><div class="nav-wrap"><a href="index.html" class="brand"><img src="assets/logo.png" alt="SUHAS GROUP"><div><div class="brand-name">SUHAS GROUP</div><div class="brand-tag">Global Opportunities, Trusted Quality</div></div></a><nav class="nav-links"><a href="index.html">Home</a><a href="jobs.html">Find Jobs</a><a href="group.html">Our Companies</a><div class="nav-cta nav-cta-m"></div></nav><div class="nav-cta"></div><button class="menu-toggle" aria-label="Menu">&#9776;</button></div></header>
<main class="wrap"><section class="hero"><div class="avatar-wrap"><img id="avatar" class="avatar" src="assets/logo.png" alt="Profile photo"><button id="photo-btn" type="button" class="btn btn-gold btn-sm photo-btn">Change photo</button><input id="photo" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><div class="profile-summary"><h1 id="profile-name" class="profile-name">Your Name</h1><div class="profile-meta-window" aria-label="Company and university"><div id="profile-meta-track" class="profile-meta-track"><span id="profile-company" class="profile-meta profile-company"></span><span class="profile-separator">|</span><span id="profile-university" class="profile-meta profile-university"></span><span class="profile-separator">|</span><span id="profile-company-copy" class="profile-meta profile-company" aria-hidden="true"></span><span class="profile-separator" aria-hidden="true">|</span><span id="profile-university-copy" class="profile-meta profile-university" aria-hidden="true"></span></div></div><p id="profile-bio" class="profile-bio"></p></div></section>
<section class="card"><div id="msg" class="msg"></div><form id="form"><h2 class="section">01 · Personal information</h2><div class="grid">
<div class="field"><label>Full name <b class="req">*</b></label><input id="full_name" required maxlength="100" autocomplete="name"></div>
<div class="field"><label>Mobile number <b class="req">*</b></label><input id="mobile" required type="tel" maxlength="25" placeholder="+880 1XXXXXXXXX"></div>
<div class="field"><label>Gender <b class="req">*</b></label><select id="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Prefer not to say</option><option>Other</option></select></div>
<div class="field"><label>Date of birth <b class="req">*</b></label><input id="dob" type="date" required></div>
<div class="field"><label>Email address</label><input id="email" type="email" readonly></div>
<div class="field"><label>Current city / country</label><input id="location" placeholder="Dhaka, Bangladesh" maxlength="120"></div>
</div><h2 class="section">02 · Work information</h2><div class="grid">
<div class="field"><label>Working company <b class="req">*</b></label><input id="company" required maxlength="150" placeholder="Company / organization"></div>
<div class="field"><label>Position <b class="req">*</b></label><input id="position" required maxlength="120" placeholder="Job title / Student"></div>
</div><h2 class="section">03 · Education details</h2><div class="grid">
<div class="field"><label>Highest education <b class="req">*</b></label><select id="education_level" required><option value="">Choose level</option><option>Primary</option><option>Secondary / SSC / O-Level</option><option>Higher Secondary / HSC / A-Level</option><option>Diploma</option><option>Bachelor's</option><option>Master's</option><option>PhD / Doctorate</option><option>Other</option></select></div>
<div class="field"><label>Major / subject <b class="req">*</b></label><input id="major" required maxlength="150" placeholder="Textile Engineering, Accounting..."></div>
<div class="field"><label>School</label><input id="school" maxlength="150"></div><div class="field"><label>College</label><input id="college" maxlength="150"></div>
<div class="field"><label>University / Institute <b class="req">*</b></label><input id="university" required maxlength="180"></div>
<div class="field"><label>Graduation year</label><input id="graduation_year" type="number" min="1950" max="2100" placeholder="2024"></div>
<div class="field"><label>Study status <b class="req">*</b></label><select id="study_status" required><option value="">Choose status</option><option>Completed</option><option>Currently studying</option><option>Not completed</option></select></div>
</div><h2 class="section">04 · Professional introduction</h2><div class="grid">
<div class="field full"><label>About you (optional)</label><textarea id="bio" rows="4" maxlength="700" placeholder="Write a short introduction..."></textarea></div>
<div class="field full"><label>Skills (optional)</label><input id="skills" maxlength="300" placeholder="MS Excel, Merchandising, Communication"></div>
<div class="field full"><label>LinkedIn profile (optional)</label><input id="linkedin_url" type="url" maxlength="250" placeholder="https://www.linkedin.com/in/..."></div>
</div><div class="actions"><button id="save" type="submit" class="btn btn-primary">Save my profile</button><a href="index.html" class="btn btn-outline">Main website</a></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/auth.js"></script><script src="assets/script.js"></script><script>
(async()=>{const user=await window.requireAuth();if(!user)return;const $=id=>document.getElementById(id),fields=['full_name','mobile','gender','dob','location','company','position','education_level','major','school','college','university','graduation_year','study_status','bio','skills','linkedin_url'];function say(t,ok){$('msg').textContent=t;$('msg').style.display='block';$('msg').style.background=ok?'#e8f7ed':'#fff0ef';$('msg').style.color=ok?'#17633a':'#a53225';}
if(await window.checkIsAdmin()){location.replace('app.html');return;}$('email').value=user.email||'';$('dob').max=new Date().toISOString().slice(0,10);
const q=await sb.from('suhas_member_profiles').select('*').eq('user_id',user.id).maybeSingle();if(q.error){say('Profile database setup is pending. Apply the SQL migration first. '+q.error.message,false);$('save').disabled=true;return;}const row=q.data||{};fields.forEach(k=>$(k).value=row[k]??(k==='full_name'?(user.user_metadata?.full_name||''):''));if(row.profile_photo_url)$('avatar').src=row.profile_photo_url;
$('profile-name').textContent=row.full_name?(row.full_name.toLowerCase().startsWith('mr.')||row.full_name.toLowerCase().startsWith('mrs.')||row.full_name.toLowerCase().startsWith('ms.')?row.full_name:'Mr. '+row.full_name):'Your Name';const company=row.company||'Company not added';const university=row.university||'University not added';$('profile-company').textContent=company;$('profile-company-copy').textContent=company;$('profile-university').textContent=university;$('profile-university-copy').textContent=university;$('profile-bio').textContent=row.bio||[row.position,row.skills].filter(Boolean).join(' · ');if(!row.profile_complete)say('Please complete all required fields to activate your account.',true);
$('photo-btn').onclick=()=>$('photo').click();$('photo').onchange=async()=>{const f=$('photo').files[0];if(!f)return;if(f.size>5242880){say('Photo must be 5 MB or less.',false);return;}const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/avatar.'+(['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg');const up=await sb.storage.from('member-avatars').upload(path,f,{upsert:true,contentType:f.type});if(up.error){say('Upload failed: '+up.error.message,false);return;}const url=sb.storage.from('member-avatars').getPublicUrl(path).data.publicUrl;$('avatar').src=url+'?v='+Date.now();const sv=await sb.from('suhas_member_profiles').upsert({user_id:user.id,email:user.email,profile_photo_url:url},{onConflict:'user_id'});if(sv.error)say('Photo uploaded but profile save failed: '+sv.error.message,false);else say('Profile photo updated.',true);};
$('form').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;b.textContent='Saving...';const d={user_id:user.id,email:user.email};fields.forEach(k=>d[k]=$(k).value.trim());d.graduation_year=d.graduation_year?Number(d.graduation_year):null;d.profile_complete=!!(d.full_name&&d.mobile&&d.gender&&d.dob&&d.company&&d.position&&d.education_level&&d.major&&d.university&&d.study_status);d.updated_at=new Date().toISOString();if(!d.profile_complete){say('Please complete every required field.',false);b.disabled=false;b.textContent='Save my profile';return;}const r=await sb.from('suhas_member_profiles').upsert(d,{onConflict:'user_id'});if(r.error){say('Could not save: '+r.error.message,false);b.disabled=false;b.textContent='Save my profile';return;}await sb.auth.updateUser({data:{full_name:d.full_name,phone:d.mobile}});say('Profile saved successfully.',true);b.textContent='Saved ✓';setTimeout(()=>location.href=(user.email||'').toLowerCase().endsWith('@o5-intl.com')?'o5-desk.html':'app.html',900);};})();
</script></body></html>
