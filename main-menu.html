<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2855"><title>Main Menu | SUHAS GROUP</title><link rel="stylesheet" href="assets/styles.css"><style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#06152f;color:#fff}
body{overflow-x:hidden}
.menu-wrap{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:26px 18px 110px;background:radial-gradient(ellipse at 50% 34%,#1c4b85 0%,#102f5d 34%,#081d3c 67%,#041127 100%)}
.menu-wrap:before,.menu-wrap:after{content:"";position:absolute;inset:-25%;pointer-events:none}
.menu-wrap:before{background:repeating-linear-gradient(118deg,transparent 0 65px,#ffffff08 66px,#ffffff08 67px,transparent 68px 132px);transform:perspective(700px) rotateX(58deg) translateY(20%);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.menu-wrap:after{background:radial-gradient(circle at 50% 48%,transparent 0 28%,#020a1b55 78%,#020817aa 100%)}
.welcome-stage{width:min(100%,1050px);position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(14px,3vh,28px);isolation:isolate}
.logo-halo{width:clamp(118px,22vw,190px);aspect-ratio:1;position:relative;display:grid;place-items:center;border-radius:36%;background:linear-gradient(145deg,#ffffff,#dce9fb 38%,#7298c9 70%,#f8fbff);box-shadow:0 0 0 8px #ffffff0c,0 0 0 17px #8cc5ff0c,0 20px 50px #0008,inset 0 3px 8px #fff;transform:perspective(700px) rotateY(-9deg) rotateX(5deg);animation:logoHover 5s ease-in-out infinite}
.logo-halo:before{content:"";position:absolute;inset:-15px;border-radius:40%;border:1px solid #a8d7ff65;transform:translateZ(-20px) rotate(18deg);box-shadow:0 0 32px #59aaff33}
.logo-halo:after{content:"";position:absolute;inset:-27px;border-radius:44%;border:1px solid #e5c87955;transform:rotate(-18deg)}
.logo-halo img{width:84%;height:84%;object-fit:contain;border-radius:24%;filter:drop-shadow(0 9px 9px #09244b66)}
.welcome-kicker{color:#f2d38b;font-size:clamp(10px,1.6vw,13px);font-weight:850;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 14px #f0c96c55}
.welcome-title{margin:0;line-height:.98;letter-spacing:-.055em;font-size:clamp(42px,9.2vw,100px);font-weight:950;text-transform:uppercase;color:#f8fbff;background:linear-gradient(180deg,#fff 0%,#eaf3ff 28%,#a8c8ef 56%,#f4d88d 78%,#b8893e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #7598c4) drop-shadow(0 7px 0 #31517c) drop-shadow(0 15px 17px #0009);transform:perspective(650px) rotateX(7deg)}
.welcome-title span{display:block;font-size:.42em;letter-spacing:.26em;margin-bottom:.32em;-webkit-text-fill-color:#d7e8ff;color:#d7e8ff;filter:drop-shadow(0 3px 0 #24456d)}
.welcome-subtitle{margin:0;color:#d6e5f8;font-size:clamp(13px,2.2vw,19px);letter-spacing:.08em;line-height:1.65;max-width:650px;text-shadow:0 2px 12px #0008}
.welcome-divider{width:min(360px,65vw);height:1px;background:linear-gradient(90deg,transparent,#d9bd7c,#9ccaff,transparent);box-shadow:0 0 16px #9acbff77}
.welcome-values{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);flex-wrap:wrap;color:#c5d8f2;font-size:clamp(9px,1.5vw,12px);font-weight:800;letter-spacing:.19em;text-transform:uppercase}
.welcome-values span+span:before{content:"✦";color:#edcf83;margin-right:clamp(12px,3vw,32px)}
.welcome-orbit{position:absolute;width:min(80vw,650px);height:min(80vw,650px);border:1px solid #9bcaff20;border-radius:50%;z-index:-1;transform:rotateX(72deg) rotateZ(-14deg);box-shadow:0 0 65px #69b7ff0c,inset 0 0 45px #69b7ff0c}
.welcome-orbit:before,.welcome-orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#f4d68b;box-shadow:0 0 20px #f4d68b;top:50%}
.welcome-orbit:before{left:7%}.welcome-orbit:after{right:12%;background:#8ed4ff;box-shadow:0 0 20px #8ed4ff}
.welcome-stars{position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(2px 2px at 15% 24%,#fff9 50%,transparent 100%),radial-gradient(2px 2px at 82% 18%,#cce7ffbb 50%,transparent 100%),radial-gradient(1.5px 1.5px at 24% 78%,#fff9 50%,transparent 100%),radial-gradient(2px 2px at 89% 72%,#f4d68bbb 50%,transparent 100%),radial-gradient(1px 1px at 67% 84%,#fff9 50%,transparent 100%),radial-gradient(1px 1px at 8% 58%,#b7dcffbb 50%,transparent 100%)}
@keyframes logoHover{0%,100%{transform:perspective(700px) rotateY(-9deg) rotateX(5deg) translateY(0)}50%{transform:perspective(700px) rotateY(8deg) rotateX(1deg) translateY(-9px)}}
@media(max-width:600px){.menu-wrap{padding:20px 16px calc(105px + env(safe-area-inset-bottom));min-height:100svh}.welcome-stage{gap:clamp(15px,3vh,24px)}.welcome-title{font-size:clamp(39px,11vw,68px)}.welcome-subtitle{max-width:330px}.welcome-values{gap:10px}.welcome-values span+span:before{margin-right:10px}.welcome-orbit{width:115vw;height:115vw}}
@media(prefers-reduced-motion:reduce){.logo-halo{animation:none}}
</style></head><body><main class="menu-wrap"><div class="welcome-stars"></div><section class="welcome-stage" aria-label="Welcome to SUHAS GROUP"><div class="welcome-orbit"></div><div class="logo-halo"><img src="assets/logo.png" alt="SUHAS GROUP logo"></div><div class="welcome-kicker">A world of opportunities</div><h1 class="welcome-title"><span>Welcome to</span>SUHAS GROUP</h1><div class="welcome-divider"></div><p class="welcome-subtitle">One vision. One community. Endless possibilities.<br>We are delighted to have you with us.</p><div class="welcome-values"><span>Careers</span><span>Quality</span><span>Design</span><span>Innovation</span></div></section></main><script src="assets/script.js?v=20261111-welcome-only"></script></body>
