<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suhas Net | Professional Network</title>
<meta name="description" content="Suhas Net — a professional network to connect, share, find jobs and grow your career.">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/suhas-net-logo-96.png">
<link rel="apple-touch-icon" href="assets/suhas-net-logo-192.png">
<meta property="og:title" content="Suhas Net — Professional Network">
<meta property="og:image" content="https://suhasgroup.pages.dev/assets/suhas-net-logo-512.png">
<style>
:root{--blue:#0b5fff;--blue-d:#0647c4;--ink:#101828;--mut:#5b6678;--line:#e1e5ec;--bg:#f3f4f6;--card:#fff;--yel:#ffe600;--ok:#157347;--bad:#b42318;--r:12px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;padding-bottom:64px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
img{max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pad{padding:16px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:12px}
h1,h2,h3{margin:0}h2{font-size:17px}h3{font-size:15px}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1128px;margin:auto;display:flex;align-items:center;gap:12px;padding:6px 14px;height:56px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:800;font-size:18px;white-space:nowrap}
.brand img{width:38px;height:38px;border-radius:9px}.brand:hover{text-decoration:none}
.search{position:relative;flex:0 1 280px}
.search input{width:100%;height:36px;border:0;border-radius:8px;background:#eef1f6;padding:0 12px 0 34px;font:inherit}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;fill:var(--mut)}
.sres{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;max-height:360px;overflow:auto;display:none}
.sres a{display:flex;gap:10px;padding:9px 12px;color:var(--ink);align-items:center}.sres a:hover{background:#f3f6ff;text-decoration:none}
.nav{display:flex;margin-left:auto;gap:2px}
.nav a,.nav button{position:relative;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 12px;font-size:11px;min-width:64px;border-bottom:2px solid transparent}
.nav svg{width:22px;height:22px;fill:currentColor}
.nav a:hover,.nav button:hover{color:var(--ink);text-decoration:none}
.nav .on{color:var(--ink);border-bottom-color:var(--ink)}
.badge{position:absolute;top:0;right:14px;background:#d11124;color:#fff;border-radius:10px;font-size:10px;min-width:17px;padding:1px 4px;text-align:center;display:none}
.me{position:relative}
.menu{position:absolute;right:0;top:48px;width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #0003;display:none;padding:12px;z-index:60}
.menu.open{display:block}.menu a,.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 4px;color:var(--ink);font-size:14px;flex-direction:row;min-width:0}
.menu a:hover,.menu button:hover{background:#f3f6ff;text-decoration:none}
/* layout */
.wrap{max-width:1128px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:225px minmax(0,540px) 300px;gap:22px;justify-content:center;align-items:start}
.wrap.wide{grid-template-columns:minmax(0,820px);justify-content:center}
.wrap.two{grid-template-columns:minmax(0,700px) 300px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#dde5f5;flex:none}
.av.l{width:64px;height:64px}.av.s{width:32px;height:32px}.av.xl{width:132px;height:132px;border:4px solid #fff}
.btn{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:22px;padding:6px 16px;font-weight:600;font-size:14px}
.btn:hover{background:#eaf1ff;text-decoration:none}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.g{border-color:var(--mut);color:var(--mut)}.btn.g:hover{background:#f1f3f6}
.btn:disabled{opacity:.55;cursor:default}
.mini{border:0;background:none;color:var(--mut);padding:8px 10px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.mini:hover{background:#f1f3f6}.mini.on{color:var(--blue)}
.mini svg{width:19px;height:19px;fill:currentColor}
/* left profile card */
.pc .cov{height:58px;background:linear-gradient(120deg,#0b5fff,#101828 60%,#ffe600)}
.pc .in{padding:0 14px 14px;text-align:center;margin-top:-26px}
.pc .av.l{border:2px solid #fff}
.stat{display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.stat b{color:var(--blue)}
/* composer */
.comp{padding:12px 16px}
.comp .fake{flex:1;text-align:left;border:1px solid var(--mut);border-radius:30px;background:#fff;color:var(--mut);padding:13px 16px;font-weight:600}
.comp .fake:hover{background:#f3f4f6}
.tools{display:flex;justify-content:space-around;margin-top:6px}
/* post */
.post{margin-top:10px}.post .hd{display:flex;gap:10px;padding:12px 16px 4px}
.post .body{padding:6px 16px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .media img,.post .media video{width:100%;display:block;max-height:560px;object-fit:contain;background:#000}
.post .counts{display:flex;justify-content:space-between;padding:8px 16px;color:var(--mut);font-size:12px}
.post .acts{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:2px 6px}
.cmts{border-top:1px solid var(--line);padding:10px 16px;display:none}.cmts.open{display:block}
.cm{display:flex;gap:8px;margin:8px 0}.cm .bub{background:#f1f3f6;border-radius:0 12px 12px 12px;padding:8px 12px;flex:1}
.cmf{display:flex;gap:8px}.cmf input{flex:1;border:1px solid var(--line);border-radius:22px;padding:8px 14px;font:inherit}
/* generic list */
.li{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block}
.li.unread{background:#eef4ff}
.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font-size:13px;color:var(--mut)}
.chip.on{background:#0a7a3d;border-color:#0a7a3d;color:#fff}
.skill{display:inline-block;background:#eef4ff;color:var(--blue-d);border-radius:14px;padding:3px 11px;margin:3px 4px 0 0;font-size:13px}
/* profile */
.cover{height:200px;background:linear-gradient(120deg,#0b5fff,#101828 60%,#ffe600);background-size:cover;background-position:center;position:relative}
.ph{padding:0 24px 18px;position:relative}.ph .av.xl{margin-top:-70px}
.sec{margin-top:10px}.sec h3{padding:16px 20px 0}.sec .c{padding:8px 20px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
/* messaging */
.msg{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 150px);min-height:440px}
.msg .l{border-right:1px solid var(--line);overflow:auto}.msg .r{display:flex;flex-direction:column;min-width:0}
.thr{flex:1;overflow:auto;padding:14px;background:#fafbfc;display:flex;flex-direction:column;gap:6px}
.bb{max-width:75%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.bb.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue)}
.sendf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.sendf input{flex:1;border:1px solid var(--line);border-radius:22px;padding:9px 14px;font:inherit}
.cv{padding:10px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line)}.cv:hover,.cv.on{background:#eef4ff}
/* modal */
.mod{position:fixed;inset:0;background:#0007;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.mod.open{display:flex}.mod .card{width:100%;max-width:560px}
.mod .hd2{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mod .x{border:0;background:none;font-size:24px;line-height:1}
.fld{display:block;margin:10px 0 0;font-weight:600;font-size:13px}.fld input,.fld textarea,.fld select{width:100%;margin-top:4px;border:1px solid #c3cad5;border-radius:8px;padding:9px 11px;font:inherit}
textarea{resize:vertical}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 18px;border-radius:24px;z-index:200;display:none;max-width:90vw}
.toast.bad{background:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center;padding:12px}
.bnav{display:none}
@media(max-width:1000px){.wrap{grid-template-columns:225px minmax(0,1fr)}.wrap .rt{display:none}.wrap.two{grid-template-columns:minmax(0,1fr)}.wrap.two .rt{display:block}}
@media(max-width:760px){
 .wrap,.wrap.two{grid-template-columns:minmax(0,1fr);margin-top:10px;gap:10px}.wrap .lf{display:none}.nav{display:none}.search{flex:1}.brand span{display:none}
 .me-top{display:block!important}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;color:var(--mut);font-size:10px;padding:6px 0;position:relative}.bnav a.on{color:var(--blue)}.bnav svg{width:22px;height:22px;fill:currentColor}.bnav a:hover{text-decoration:none}
 .bnav .badge{right:22%}
 .acts .mini{padding:8px 5px;font-size:12px;gap:3px;flex-direction:column}.acts .mini svg{width:18px;height:18px}
 .msg{grid-template-columns:1fr;height:calc(100vh - 130px)}.msg.chat .l{display:none}.msg:not(.chat) .r{display:none}
 .cover{height:130px}.av.xl{width:96px;height:96px}.ph .av.xl{margin-top:-48px}
}
.me-top{display:none}
</style>
</head>

<script>
(async()=>{
'use strict';
const $=id=>document.getElementById(id),sb=window.sb;
const DEF='assets/suhas-net-logo-96.png';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return new Date(d).toLocaleDateString()};
function toast(t,bad){const e=$('toast');e.textContent=t;e.className='toast'+(bad?' bad':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
if(!sb){document.body.innerHTML='<p style="padding:30px">Could not load Suhas Net. Please refresh.</p>';return}
const sess=(await sb.auth.getSession()).data.session;
if(!sess){location.replace('login.html?next='+encodeURIComponent('social.html'+location.hash));return}
const me=sess.user.id,meta=sess.user.user_metadata||{};
const PC={};                       // profile cache
const PF='user_id,full_name,company,position,location,skills,profile_photo_url,cover_photo_url,bio,school,college,university,major,education_level,graduation_year,linkedin_url,email_verified';
async function profs(ids){ids=[...new Set(ids.filter(Boolean))].filter(i=>!PC[i]);if(ids.length){const r=await sb.from('suhas_public_profiles').select(PF).in('user_id',ids);(r.data||[]).forEach(p=>PC[p.user_id]=p);ids.forEach(i=>{if(!PC[i])PC[i]={user_id:i,full_name:'Suhas Net Member'}})}}
const nm=id=>(PC[id]&&PC[id].full_name)||'Suhas Net Member';
const av=(id,c='')=>`<img class="av ${c}" src="${esc(safeUrl(PC[id]&&PC[id].profile_photo_url)||DEF)}" alt="" loading="lazy" onerror="this.src='${DEF}'">`;
const head=id=>{const p=PC[id]||{};return[p.position,p.company].filter(Boolean).join(' at ')||p.location||'Suhas Net member'};
const link=id=>`#/in/${id}`;
// ---------- connections ----------
let conn=new Set(),incoming=[],outgoing=[];
async function loadConn(){
 const r=await sb.from('suhas_friend_requests').select('id,sender_id,recipient_id,status,created_at').or(`sender_id.eq.${me},recipient_id.eq.${me}`);
 conn=new Set();incoming=[];outgoing=[];
 (r.data||[]).forEach(x=>{const o=x.sender_id===me?x.recipient_id:x.sender_id;if(x.status==='accepted')conn.add(o);else if(x.status==='pending'){x.recipient_id===me?incoming.push(x):outgoing.push(x)}});
 await profs([...conn,...incoming.map(x=>x.sender_id),...outgoing.map(x=>x.recipient_id)]);
 const n=incoming.length;['b-net','b-net2'].forEach(i=>{const b=$(i);b.textContent=n;b.style.display=n?'block':'none'});
}
const relOf=id=>id===me?'me':conn.has(id)?'conn':outgoing.some(x=>x.recipient_id===id)?'sent':incoming.some(x=>x.sender_id===id)?'recv':'none';
async function connect(id){const r=await sb.from('suhas_friend_requests').insert({sender_id:me,recipient_id:id,status:'pending'});if(r.error)return toast(r.error.message,true);toast('Invitation sent');await loadConn();route()}
async function respond(reqId,ok){const r=ok?await sb.from('suhas_friend_requests').update({status:'accepted',updated_at:new Date().toISOString()}).eq('id',reqId).eq('recipient_id',me):await sb.from('suhas_friend_requests').delete().eq('id',reqId).eq('recipient_id',me);if(r.error)return toast(r.error.message,true);toast(ok?'You are now connected':'Invitation ignored');await loadConn();route()}
async function withdraw(id){const r=await sb.from('suhas_friend_requests').delete().eq('sender_id',me).eq('recipient_id',id).eq('status','pending');if(r.error)return toast(r.error.message,true);await loadConn();route()}
async function disconnect(id){if(!confirm('Remove this connection?'))return;const r=await sb.from('suhas_friend_requests').delete().eq('status','accepted').or(`and(sender_id.eq.${me},recipient_id.eq.${id}),and(sender_id.eq.${id},recipient_id.eq.${me})`);if(r.error)return toast(r.error.message,true);await loadConn();route()}
function connBtn(id){const r=relOf(id);if(r==='me')return'';
 if(r==='conn')return`<button class="btn p" data-msg="${id}">Message</button>`;
 if(r==='sent')return`<button class="btn g" data-withdraw="${id}">Pending</button>`;
 if(r==='recv'){const q=incoming.find(x=>x.sender_id===id);return`<button class="btn p" data-acc="${q.id}">Accept</button>`}
 return`<button class="btn" data-connect="${id}">+ Connect</button>`}
// ---------- own profile ----------
await profs([me]);
if(!PC[me]||!PC[me].profile_photo_url&&!PC[me].position&&PC[me].full_name==='Suhas Net Member')PC[me]={user_id:me,full_name:meta.full_name||meta.name||sess.user.email,profile_photo_url:meta.avatar_url||meta.picture};

 if(arg){activeConv=arg;const c=convs.find(x=>x.id===arg);await openThread(arg,c&&c.o,v)}
}
async function loadThread(id){const r=await sb.from('suhas_messages').select('id,sender_id,body,created_at').eq('conversation_id',id).order('created_at').limit(300);const t=$('thr');if(!t)return;const stick=t.scrollHeight-t.scrollTop-t.clientHeight<80;t.innerHTML=(r.data||[]).map(x=>`<div class="bb ${x.sender_id===me?'me':''}" title="${new Date(x.created_at).toLocaleString()}">${esc(x.body)}</div>`).join('')||'<div class="empty">Say hello 👋</div>';if(stick||!t.dataset.init){t.scrollTop=t.scrollHeight;t.dataset.init=1}
 sb.from('suhas_messages').update({read_at:new Date().toISOString()}).eq('conversation_id',id).neq('sender_id',me).is('read_at',null).then(()=>unreadMsgs())}
async function openThread(id,other,v){
 $('cr').innerHTML=`<div class="row pad" style="border-bottom:1px solid var(--line)"><a href="#/messaging" class="mini" id="back">←</a>${av(other,'s')}<a href="${link(other)}" style="color:var(--ink)"><b>${esc(nm(other))}</b></a></div><div class="thr" id="thr"></div><form class="sendf" id="sf"><input id="mt" maxlength="2000" placeholder="Write a message…" autocomplete="off" required><button class="btn p">Send</button></form>`;
 $('sf').onsubmit=async e=>{e.preventDefault();const b=$('mt').value.trim();if(!b)return;$('mt').value='';const r=await sb.from('suhas_messages').insert({conversation_id:id,sender_id:me,body:b});if(r.error)toast(r.error.message,true);loadThread(id)};
 await loadThread(id);
 msgChan=sb.channel('sn-thread-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'suhas_messages',filter:'conversation_id=eq.'+id},()=>loadThread(id)).subscribe();
 pollT=setInterval(()=>{if(activeConv===id&&/messaging/.test(location.hash))loadThread(id)},10000);
}
// ---------- notifications ----------
async function vNotif(_,v){
 app.innerHTML=`<div class="wrap wide"><section><div class="card"><div class="pad row"><h2>Notifications</h2><span class="sp"></span><button class="btn g" id="markall">Mark all read</button></div><div id="nl"><div class="empty">Loading…</div></div></div></section></div>`;
 const r=await sb.from('suhas_notifications').select('id,actor_id,kind,entity_type,entity_id,message,created_at,read_at').eq('recipient_id',me).order('created_at',{ascending:false}).limit(60);
 if(v!==view)return;await profs((r.data||[]).map(x=>x.actor_id));
 const d=r.data||[];$('nl').innerHTML=d.length?d.map(x=>`<div class="li ${x.read_at?'':'unread'}" data-n="${x.id}" data-k="${x.kind}" data-e="${esc(x.entity_id)}" style="cursor:pointer">${x.actor_id?av(x.actor_id):`<img class="av" src="${DEF}" alt="">`}<div class="t"><div>${esc(x.message)}</div><div class="sm mut">${ago(x.created_at)}</div></div></div>`).join(''):'<div class="empty">You are all caught up.</div>';
 $('markall').onclick=async()=>{await sb.from('suhas_notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',me).is('read_at',null);countNotif();route()};
}
async function countNotif(){try{const r=await sb.from('suhas_notifications').select('id',{count:'exact',head:true}).eq('recipient_id',me).is('read_at',null);setBadge('not',r.count||0)}catch(e){}}
// ---------- profile ----------
async function vProfile(id,v){
 if(!id)id=me;await profs([id]);if(v!==view)return;const p=PC[id]||{};
 const [ps,fc]=await Promise.all([sb.from('suhas_posts').select('id,user_id,content,created_at,media_url,media_type,audience').eq('user_id',id).order('created_at',{ascending:false}).limit(20),sb.from('suhas_friend_requests').select('id',{count:'exact',head:true}).eq('status','accepted').or(`sender_id.eq.${id},recipient_id.eq.${id}`)]);
 const posts=await enrich(ps.data||[]);if(v!==view)return;
 const edu=[p.university||p.college||p.school,p.major,p.graduation_year].filter(Boolean).join(' · ');
 const sk=(p.skills||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
 app.innerHTML=`<div class="wrap two"><section><div class="card"><div class="cover" style="${p.cover_photo_url?`background-image:url('${esc(safeUrl(p.cover_photo_url))}')`:''}"></div><div class="ph"><div class="row" style="align-items:flex-end"><img class="av xl" src="${esc(safeUrl(p.profile_photo_url)||DEF)}" alt="" onerror="this.src='${DEF}'"><span class="sp"></span>${id===me?'<button class="btn" id="edit-prof">✎ Edit profile</button>':''}</div>
 <h1 style="font-size:22px;margin-top:8px">${esc(p.full_name||'Member')} ${p.email_verified?'<span title="Verified email" style="color:var(--blue)">✔</span>':''}</h1><div>${esc(head(id))}</div><div class="sm mut">${esc(p.location||'')} · <a href="#/network">${fc.count||0} connection${fc.count===1?'':'s'}</a></div>
 <div class="row" style="margin-top:12px;flex-wrap:wrap">${connBtn(id)}${id!==me&&relOf(id)!=='conn'?`<button class="btn" data-msg="${id}">Message</button>`:''}${safeUrl(p.linkedin_url)?`<a class="btn g" href="${esc(safeUrl(p.linkedin_url))}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`:''}${relOf(id)==='conn'?`<button class="btn g" data-disc="${id}">Remove</button>`:''}</div></div></div>
 ${p.bio?`<div class="card sec"><h3>About</h3><div class="c">${esc(p.bio)}</div></div>`:id===me?'<div class="card sec"><h3>About</h3><div class="c mut">Add a summary so people know who you are.</div></div>':''}
 ${(p.position||p.company)?`<div class="card sec"><h3>Experience</h3><div class="c"><b>${esc(p.position||'')}</b><div>${esc(p.company||'')}</div></div></div>`:''}
 ${edu?`<div class="card sec"><h3>Education</h3><div class="c">${esc(edu)}</div></div>`:''}
 ${sk.length?`<div class="card sec"><h3>Skills</h3><div class="c">${sk.map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div></div>`:''}
 <h3 style="margin:16px 4px 0">Activity</h3>${posts.length?posts.map(postHtml).join(''):'<div class="card empty" style="margin-top:10px">No posts yet.</div>'}</section><div id="rt"></div></div>`;
 rightRail().then(h=>{if(v===view&&$('rt'))$('rt').outerHTML=h});
 if(id===me)$('edit-prof').onclick=editProfile;
}
function editProfile(){const p=PC[me]||{};const f=(k,l,t='input')=>`<label class="fld">${l}${t==='ta'?`<textarea name="${k}" rows="4">${esc(p[k]||'')}</textarea>`:`<input name="${k}" value="${esc(p[k]||'')}">`}</label>`;
 $('modc').innerHTML=`<div class="hd2"><h2>Edit profile</h2><span class="sp"></span><button class="x" data-close>×</button></div><form class="pad" id="pform"><div class="row" style="flex-wrap:wrap"><label class="btn g">Change photo<input type="file" id="ph-f" accept="image/jpeg,image/png,image/webp" hidden></label><label class="btn g">Change cover<input type="file" id="cv-f" accept="image/jpeg,image/png,image/webp" hidden></label><span class="sm mut" id="ph-n"></span></div>
 ${f('full_name','Full name')}${f('position','Headline / position')}${f('company','Company')}${f('location','Location')}${f('bio','About','ta')}${f('skills','Skills (comma separated)')}${f('university','University / college')}${f('major','Field of study')}${f('graduation_year','Graduation year')}${f('linkedin_url','LinkedIn URL')}
 <div class="row" style="margin-top:16px"><span class="sp"></span><button type="button" class="btn g" data-close>Cancel</button><button class="btn p" id="psave">Save</button></div></form>`;
 $('mod').classList.add('open');const files={};
 $('ph-f').onchange=e=>{files.profile_photo_url=e.target.files[0];$('ph-n').textContent=files.profile_photo_url?files.profile_photo_url.name:''};
 $('cv-f').onchange=e=>{files.cover_photo_url=e.target.files[0];$('ph-n').textContent=files.cover_photo_url?files.cover_photo_url.name:''};
 $('pform').onsubmit=async e=>{e.preventDefault();const b=$('psave');b.disabled=true;b.textContent='Saving…';
  try{const d=Object.fromEntries(new FormData(e.target).entries());const payload={user_id:me,updated_at:new Date().toISOString()};
   ['full_name','position','company','location','bio','skills','university','major','linkedin_url'].forEach(k=>payload[k]=(d[k]||'').trim()||null);
   if(!payload.full_name)throw new Error('Name is required');
   if(payload.linkedin_url&&!safeUrl(payload.linkedin_url))throw new Error('LinkedIn URL must start with https://');
   const gy=parseInt(d.graduation_year,10);payload.graduation_year=gy>1950&&gy<2100?gy:null;
   for(const [k,file] of Object.entries(files)){if(!file)continue;const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];if(!ext)throw new Error('Photos must be JPG, PNG or WebP');if(file.size>8388608)throw new Error('Image must be under 8 MB');
    const path=me+'/'+(k==='cover_photo_url'?'cover':'profile')+'-'+crypto.randomUUID()+'.'+ext;const u=await sb.storage.from('member-avatars').upload(path,file,{cacheControl:'31536000',contentType:file.type});if(u.error)throw u.error;payload[k]=sb.storage.from('member-avatars').getPublicUrl(path).data.publicUrl}
   const r=await sb.from('suhas_public_profiles').upsert(payload,{onConflict:'user_id'}).select(PF).single();if(r.error)throw r.error;
   PC[me]=r.data;paintMe();closeMod();toast('Profile updated');route();
  }catch(err){toast(err.message||'Could not save',true);b.disabled=false;b.textContent='Save'}};
}
// ---------- search ----------
let st;$('q').addEventListener('input',e=>{clearTimeout(st);const q=e.target.value.trim().replace(/[%,()*]/g,' ').trim();const box=$('sres');if(q.length<2){box.style.display='none';return}
 st=setTimeout(async()=>{const r=await sb.from('suhas_public_profiles').select(PF).or(`full_name.ilike.%${q}%,position.ilike.%${q}%,company.ilike.%${q}%,skills.ilike.%${q}%`).limit(8);(r.data||[]).forEach(p=>PC[p.user_id]=p);
  box.innerHTML=(r.data||[]).length?r.data.map(p=>`<a href="${link(p.user_id)}">${av(p.user_id,'s')}<div><b>${esc(p.full_name)}</b><div class="sm mut">${esc(head(p.user_id))}</div></div></a>`).join(''):'<div class="empty">No people found</div>';box.style.display='block'},250)});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sres').style.display='none'});
$('sres').addEventListener('click',()=>{$('sres').style.display='none';$('q').value=''});
// ---------- menu / modal ----------
function closeMenu(){$('menu').classList.remove('open')}
function closeMod(){$('mod').classList.remove('open')}
$('me-btn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.me'))closeMenu();if(e.target===$('mod')||e.target.closest('[data-close]'))closeMod()});
$('signout').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};
// ---------- delegated actions ----------
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,a,[data-conv],[data-n]');if(!t)return;const d=t.dataset;
 try{
 if(t.id==='open-comp'||t.id==='c-art'){openComposer();return}
 if(t.id==='c-photo'){openComposer('image/jpeg,image/png,image/webp');return}
 if(t.id==='c-video'){openComposer('video/mp4,video/webm');return}
 if(d.connect){t.disabled=true;await connect(d.connect)}
 else if(d.acc)await respond(d.acc,true);else if(d.ign)await respond(d.ign,false);
 else if(d.withdraw)await withdraw(d.withdraw);else if(d.disc)await disconnect(d.disc);
 else if(d.msg)await startMsg(d.msg);
 else if(d.conv){location.hash='#/messaging/'+d.conv}
 else if(d.like){const id=Number(d.like),on=t.classList.contains('on');await toggle('suhas_post_likes',{post_id:id,user_id:me},{post_id:id,user_id:me},on);t.classList.toggle('on',!on);const c=t.closest('.post').querySelector('.counts span');const n=(parseInt((c.textContent.match(/\d+/)||[0])[0])||0)+(on?-1:1);c.textContent=n>0?'👍 '+n:''}
 else if(d.sv){const id=Number(d.sv),on=t.classList.contains('on');await toggle('suhas_saved_posts',{post_id:id,user_id:me},{post_id:id,user_id:me},on);t.classList.toggle('on',!on);toast(on?'Removed from saved':'Post saved')}
 else if(d.rp){if(t.classList.contains('on'))return toast('You already reposted this');const r=await sb.from('suhas_post_reposts').insert({original_post_id:Number(d.rp),user_id:me});if(r.error&&r.error.code!=='23505')throw r.error;t.classList.add('on');toast('Reposted')}
 else if(d.sh){e.preventDefault();const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'social.html#/post/'+d.sh;if(navigator.share)navigator.share({title:'Suhas Net post',url}).catch(()=>{});else{await navigator.clipboard.writeText(url);toast('Link copied')}}
 else if(d.cm){e.preventDefault();toggleComments(Number(d.cm))}
 else if(d.del){if(!confirm('Delete this post permanently?'))return;const r=await sb.from('suhas_posts').delete().eq('id',Number(d.del)).eq('user_id',me);if(r.error)throw r.error;toast('Post deleted');route()}
 else if(d.sj){const id=Number(d.sj),on=savedJobs.has(id);const r=on?await sb.from('saved_jobs').delete().eq('user_id',me).eq('job_id',id):await sb.from('saved_jobs').insert({user_id:me,job_id:id});if(r.error)throw r.error;on?savedJobs.delete(id):savedJobs.add(id);window.__drawJobs()}
 else if(d.n){const r=await sb.from('suhas_notifications').update({read_at:new Date().toISOString()}).eq('id',d.n).eq('recipient_id',me);countNotif();const k=d.k;location.hash=k==='message'?'#/messaging':k==='friend_request'?'#/network':'#/post/'+d.e}
 }catch(err){toast(err.message||'Action failed',true);if(t.disabled)t.disabled=false}
});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-cf]');if(!f)return;e.preventDefault();const i=f.querySelector('input'),c=i.value.trim();if(!c)return;i.disabled=true;
 const r=await sb.from('suhas_post_comments').insert({post_id:Number(f.dataset.cf),user_id:me,content:c});if(r.error){toast(r.error.message,true);i.disabled=false;return}
 await toggleComments(Number(f.dataset.cf),true);const el=document.querySelector(`[data-pid="${f.dataset.cf}"] [data-cm]:not(.mini)`);if(el){const n=(parseInt(el.textContent)||0)+1;el.textContent=n+' comment'+(n===1?'':'s')}});
// ---------- realtime badges ----------
sb.channel('sn-badges-'+me).on('postgres_changes',{event:'INSERT',schema:'public',table:'suhas_notifications',filter:'recipient_id=eq.'+me},()=>{countNotif();loadConn()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'suhas_messages'},()=>unreadMsgs()).subscribe();
countNotif();unreadMsgs();
if('serviceWorker' in navigator){/* service worker registered by update-manager.js */}
route();
})();
</script>
