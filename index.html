<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2A66">
<title>SUHAS GROUP | Secure Member Access</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/styles.css?v=20261108-private">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;width:100%;background:radial-gradient(circle at 50% 15%,#1c4b91 0,#0a2a66 42%,#050f22 100%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'DM Sans',Arial,sans-serif}.gate{width:min(100%,430px);text-align:center;padding:38px 28px 32px;border:1px solid #ffffff30;border-radius:26px;background:#ffffff12;box-shadow:0 24px 70px #0005;backdrop-filter:blur(12px);color:#fff}.gate img{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto;background:#fff;border-radius:24px;padding:8px;box-shadow:0 12px 28px #0004}.gate h1{color:#fff;font-size:27px;letter-spacing:.5px;margin:20px 0 7px}.gate p{color:#d8e6ff;margin:0 0 25px;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions a{padding:13px 10px;border-radius:10px;font-weight:750;text-decoration:none}.signup{background:#e8b84a;color:#241a02}.login{border:1px solid #ffffff8c;color:#fff}.foot{margin-top:24px;color:#aebfda;font-size:11px}@media(max-width:360px){.gate{padding:30px 18px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="gate">
<img src="assets/logo.png" alt="SUHAS GROUP logo">
<h1>SUHAS GROUP</h1>
<p>Secure member access. Sign in or create your account to continue.</p>
<div class="actions"><button class="signup" id="welcome-signup-open" type="button">Sign Up</button><a class="login" href="login.html">Login</a></div>
<div id="welcome-signup-panel" style="display:none;position:fixed;inset:0;z-index:9999;background:#041027eF;padding:12px;align-items:center;justify-content:center"><div style="width:min(100%,560px);height:min(92vh,780px);background:#fff;border-radius:16px;overflow:hidden;position:relative"><button id="welcome-signup-close" type="button" aria-label="Close signup" style="position:absolute;right:8px;top:8px;z-index:2;border:0;border-radius:50%;width:36px;height:36px;background:#fff;font-size:22px">×</button><iframe title="SUHAS-MAX Sign Up" src="signup.html?embedded=1" style="width:100%;height:100%;border:0"></iframe></div></div><div class="foot">Global Opportunities, Trusted Quality</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js?v=private-gate-1"></script>
<script>(function(){var p=document.getElementById('welcome-signup-panel');document.getElementById('welcome-signup-open').onclick=function(){p.style.display='flex';};document.getElementById('welcome-signup-close').onclick=function(){p.style.display='none';};p.addEventListener('click',function(e){if(e.target===p)p.style.display='none';});})();</script></body>
</html>
