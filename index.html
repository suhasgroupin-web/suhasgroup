<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2A66">
<title>SUHAS GROUP | Secure Member Access</title>
<link rel="icon" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/styles.css?v=20261108-private">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;width:100%;background:radial-gradient(circle at 50% 15%,#1c4b91 0,#0a2a66 42%,#050f22 100%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'DM Sans',Arial,sans-serif}.gate{width:min(100%,430px);text-align:center;padding:38px 28px 32px;border:1px solid #ffffff30;border-radius:26px;background:#ffffff12;box-shadow:0 24px 70px #0005;backdrop-filter:blur(12px);color:#fff}.gate img{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto;background:#fff;border-radius:24px;padding:8px;box-shadow:0 12px 28px #0004}.gate h1{color:#fff;font-size:27px;letter-spacing:.5px;margin:20px 0 7px}.gate p{color:#d8e6ff;margin:0 0 25px;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions a{padding:13px 10px;border-radius:10px;font-weight:750;text-decoration:none}.signup{background:#e8b84a;color:#241a02}.login{border:1px solid #ffffff8c;color:#fff}.foot{margin-top:24px;color:#aebfda;font-size:11px}@media(max-width:360px){.gate{padding:30px 18px}.actions{grid-template-columns:1fr}}
.actions button{padding:13px 10px;border-radius:10px;font-weight:750;text-decoration:none;border:0;font-size:15px;cursor:pointer}.welcome-signup-panel{margin-top:22px;text-align:left;background:#fff;color:#17233a;padding:20px;border-radius:16px;box-shadow:0 14px 40px #0004}.welcome-signup-panel[hidden]{display:none}.welcome-signup-panel h2{margin:0 0 7px;font-size:21px}.welcome-signup-panel p{font-size:13px;color:#52627a;margin:0 0 15px}.welcome-signup-panel label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}.welcome-signup-panel input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.signup-submit,.signup-cancel{width:100%;padding:13px;border:0;border-radius:9px;margin-top:13px;font-weight:800}.signup-submit{background:linear-gradient(135deg,#f5d27c,#d69a2c);color:#261b04}.signup-cancel{margin-top:8px;background:#e9eef6;color:#263b5c}#welcome-signup-msg{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px;line-height:1.5}.gate.signup-open{width:min(100%,520px)}@media(max-width:360px){.gate{padding:28px 16px}.actions{grid-template-columns:1fr}}</style>
</head>
<body>
<main class="gate">
<img src="assets/logo.png" alt="SUHAS GROUP logo">
<h1>SUHAS GROUP</h1>
<p>Secure member access. Sign in or create your account to continue.</p>
<div class="actions"><button class="signup" id="welcome-signup-open" type="button">Sign Up</button><a class="login" href="login.html">Login</a></div>
<section id="welcome-signup-panel" class="welcome-signup-panel" hidden><h2>Create your SUHAS-MAX account</h2><p>Complete signup here. You will stay on this Welcome Screen.</p><form id="welcome-signup-form"><label for="welcome-fullname">Full Name</label><input id="welcome-fullname" autocomplete="name" required><label for="welcome-email">Email / Gmail</label><input id="welcome-email" type="email" autocomplete="email" required><label for="welcome-password">Password</label><input id="welcome-password" type="password" minlength="12" autocomplete="new-password" required><button class="signup-submit" id="welcome-submit" type="submit">Create Account</button><button class="signup-cancel" id="welcome-cancel" type="button">Back to Welcome</button><div id="welcome-signup-msg" role="status" aria-live="polite"></div></form></section><div class="foot">Global Opportunities, Trusted Quality</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js?v=private-gate-1"></script>
<script>
(function(){
 var panel=document.getElementById('welcome-signup-panel'),gate=document.querySelector('.gate'),form=document.getElementById('welcome-signup-form'),btn=document.getElementById('welcome-submit'),msg=document.getElementById('welcome-signup-msg');
 function say(t,ok){msg.textContent=t;msg.style.display='block';msg.style.background=ok?'#e7f6ec':'#fdecea';msg.style.color=ok?'#17633a':'#9e2c20';}
 document.getElementById('welcome-signup-open').onclick=function(){panel.hidden=false;gate.classList.add('signup-open');document.getElementById('welcome-fullname').focus();};
 document.getElementById('welcome-cancel').onclick=function(){panel.hidden=true;gate.classList.remove('signup-open');msg.style.display='none';};
 form.addEventListener('submit',async function(e){
  e.preventDefault();btn.disabled=true;btn.textContent='Creating account…';msg.style.display='none';
  var fullName=document.getElementById('welcome-fullname').value.trim(),email=document.getElementById('welcome-email').value.trim(),password=document.getElementById('welcome-password').value;
  try{
   if(password.length<12)throw new Error('Password must contain at least 12 characters.');
   var r=await sb.auth.signUp({email:email,password:password,options:{emailRedirectTo:'https://suhasgroupin-web.github.io/suhasgroup/login.html?verified=1',data:{full_name:fullName,account_type:'candidate',workspace:'suhas',requested_role:'USER'}}});
   if(r.error)throw r.error;
   if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)throw new Error('This email is already registered. Please use Login.');
   if(r.data.session)await sb.auth.signOut({scope:'local'});
   say('Signup completed. Please confirm your email using the link sent to your inbox. Then press Login on the Welcome Screen. After Login, you must create your SUHAS-MAX profile before the full app opens.',true);
   form.reset();btn.textContent='Signup Completed';
  }catch(err){say(err.message||'Signup could not be completed. Please try again.',false);btn.disabled=false;btn.textContent='Create Account';}
 });
})();
</script></body>
</html>
