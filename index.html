<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'DM Sans',Arial,sans-serif}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 10%,#315b91 0,#0a2a66 48%,#050f22 100%)}
.welcome{width:min(100%,420px);padding:34px 26px 30px;text-align:center;color:#fff;border:1px solid #ffffff35;border-radius:25px;background:linear-gradient(150deg,#ffffff1c,#ffffff0b);box-shadow:0 24px 70px #0007,inset 0 1px 0 #ffffff35;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.welcome-logo{display:block;width:126px;height:126px;object-fit:contain;margin:0 auto 22px;padding:7px;border-radius:25px;background:#fff;box-shadow:0 12px 26px #0005}
.welcome h1{margin:0;color:#fff;font-size:clamp(25px,7vw,32px);font-weight:900;line-height:1.15;letter-spacing:-.035em}
.welcome-copy{margin:14px auto 27px;color:#e3edff;font-size:13px;font-weight:600;line-height:1.9;letter-spacing:.025em}
.welcome-copy span{display:block}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.auth-actions a{min-height:48px;display:flex;align-items:center;justify-content:center;padding:11px 12px;border-radius:12px;text-decoration:none;font:800 14px/1.2 'DM Sans',Arial,sans-serif;transition:transform .12s,box-shadow .12s}
.auth-actions a:active{transform:translateY(2px)}
.sign-in{background:linear-gradient(180deg,#2d64a9,#12376f);color:#fff;border:1px solid #86a9d8;box-shadow:0 4px 0 #071c3c,0 8px 16px #0004,inset 0 1px 0 #ffffff55}
.sign-up{background:linear-gradient(180deg,#ffe59b,#e9b944 55%,#bd8120);color:#211600;border:1px solid #ffe6a1;box-shadow:0 4px 0 #805414,0 8px 16px #0004,inset 0 1px 0 #fff9}
.install-app{display:block;width:100%;margin:17px auto 0;padding:10px 12px;border:1px solid #ffffff65;border-radius:10px;background:transparent;color:#e3edff;font:700 13px/1.2 'DM Sans',Arial,sans-serif;cursor:pointer}.install-app:active{background:#ffffff18}
@media(max-width:360px){body{padding:14px}.welcome{padding:28px 18px 24px}.welcome-logo{width:112px;height:112px}}
</style>
</head>
<body>
<main class="welcome">
<img class="welcome-logo" src="assets/logo.png" alt="SUHAS GROUP logo">
<h1>Welcome to SUHAS GROUP</h1>
<p class="welcome-copy">
<span>Always Trusted • Always Moving Forward</span>
<span>Built on Trust • Driven by Excellence</span>
<span>One Group, One Vision</span>
</p>
<nav class="auth-actions" aria-label="Account access">
<a class="sign-in" href="login.html?next=main-menu.html">Sign In</a>
<a class="sign-up" href="signup.html">Sign Up</a>
</nav>
<button class="install-app" id="install-app" type="button">Install App</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js?v=20261127-simple-welcome"></script>
<script>
(function(){
 var promptEvent=null,button=document.getElementById('install-app');
 window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();promptEvent=event;});
 button.addEventListener('click',async function(){
  if(promptEvent){var event=promptEvent;promptEvent=null;await event.prompt();return;}
  var ua=navigator.userAgent||'';
  if(/android/i.test(ua)) alert('Chrome menu (⋮) থেকে Install app অথবা Add to Home screen নির্বাচন করুন।');
  else if(/iphone|ipad|ipod/i.test(ua)) alert('Share menu থেকে Add to Home Screen নির্বাচন করুন।');
  else alert('Browser menu থেকে Install App নির্বাচন করুন, যদি অপশনটি থাকে।');
 });
})();
</script>
</body>
