<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>O5 Desk | SUHAS GROUP</title><link rel="stylesheet" href="assets/styles.css"><style>
body{background:#0b1018;color:#f4f6fa}.o5{max-width:850px;margin:30px auto;padding:0 18px 60px}.head{padding:22px 4px}.head h1{margin:0;font-size:30px}.head p{color:#aab3c2}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.app{display:flex;min-height:170px;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:22px;border:1px solid #343d4b;border-radius:20px;background:linear-gradient(145deg,#202936,#151b25);color:#fff;text-decoration:none;text-align:left;cursor:pointer}.app:active{transform:scale(.98)}.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#303c50;font-size:29px}.app strong{font-size:17px}.app small{color:#aab3c2}.viewer{position:fixed;inset:0;z-index:99999;margin:0;padding:0;background:#0b1018;display:flex;flex-direction:column}.viewer iframe{display:block;flex:1;width:100%;height:calc(100dvh - 58px);min-height:0;border:0;border-radius:0;background:#fff}.actions{height:58px;min-height:58px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0;padding:8px 12px;background:#111b2b;border-bottom:1px solid #34445d}.actions>div{display:flex;gap:8px}.viewer .hint{margin:0;padding:6px 12px;background:#111b2b;color:#aab3c2;font-size:12px}.actions a,.actions button{background:#303c50;color:#fff;border:0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:700}.hidden{display:none!important}@media(max-width:650px){.apps{grid-template-columns:1fr}.app{min-height:110px;flex-direction:row;justify-content:flex-start}.app .words{display:grid;gap:5px}.viewer iframe{height:calc(100dvh - 54px)}.actions{height:54px;min-height:54px}}
</style></head><body><header class="site-header"><div class="nav-wrap"><a href="index.html" class="brand"><img src="assets/logo.png" alt="SUHAS GROUP"><div><div class="brand-name">SUHAS GROUP</div><div class="brand-tag">O5 Desk</div></div></a><a class="btn btn-outline btn-sm" href="app.html">Main Menu</a></div></header><main class="o5"><div class="head"><h1>O5 Desk</h1><p>Select an application to open it inside SUHAS GROUP.</p></div><div class="apps">
<button class="app" type="button" data-open="barcode"><span class="ico">▥</span><span class="words"><strong>O5 Barcode Generator</strong><small>Report number barcode &amp; A4 PDF</small></span></button>

</div><section id="viewer" class="viewer hidden" aria-label="Application full-screen view"><div class="actions"><strong id="viewTitle">Application</strong><div><a id="external" href="#" target="_blank" rel="noopener">Open separately</a><button id="close" type="button">✕ Close</button></div></div><iframe id="frame" title="O5 application" src="about:blank" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe><p class="hint">অ্যাপটি এখানে না খুললে “Open separately” চাপুন।</p></section></main><script>(()=>{const apps={barcode:{title:'O5 Barcode Generator',url:'barcode/'},bill:{title:'O5 Bill Calculator',url:'https://o5billcalculator.lovable.app/login'},all:{title:'O5 All-in-One',url:'https://o5-all-in-one-hxzp.glide.page/dl/d0a5f4'}};const panel=document.getElementById('viewer'),frame=document.getElementById('frame'),title=document.getElementById('viewTitle'),external=document.getElementById('external');document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const a=apps[b.dataset.open];title.textContent=a.title;external.href=a.url;frame.src=a.url;panel.classList.remove('hidden');document.body.style.overflow='hidden';}));function closeApp(){frame.src='about:blank';panel.classList.add('hidden');document.body.style.overflow='';}document.getElementById('close').onclick=closeApp;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.classList.contains('hidden'))closeApp();});})();</script></body></html>
