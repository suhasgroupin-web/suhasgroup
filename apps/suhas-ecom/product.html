<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2447">
<link rel="icon" type="image/png" href="favicon.png"><title>Product — SUHAS E-COM</title>
<link rel="stylesheet" href="ecom.css">
</head>
<body>
<div id="shellTop"></div>
<div class="wrap" id="page"><div class="empty" style="padding:80px 0;text-align:center">Loading product…</div></div>
<div id="shellBottom"></div>
<script type="module">
import {$,esc,money,disc,loadCatalog,cardHtml,pimg,mountShell,mountCommerce,watchMyOrders,addToCart,openCheckout,waLink} from './ecom-core.js';
mountShell('');
let products=[];mountCommerce(()=>products);
const id=new URLSearchParams(location.search).get('id');
try{products=await loadCatalog()}catch(e){}
const p=products.find(x=>String(x.id)===String(id));
const page=$('page');
if(!p){page.innerHTML='<div class="panel" style="margin:30px 0;text-align:center"><h2>Product not found</h2><p class="muted">This product may have been removed or is no longer available.</p><a class="btn pri" href="index.html">Back to marketplace</a></div>'}
else render(p);
function render(p){
  document.title=p.title+' — SUHAS E-COM';
  const d=disc(p),url=location.href,ok=!p.isDemo&&p.stock>=p.min;
  const specs=Array.isArray(p.specs)?p.specs.filter(s=>s&&s.k):[];
  const details=[['Brand',p.brand],['Category',p.category],['Minimum order',p.min+' '+p.unit+(p.min>1?'s':'')],['Lead time',p.lead_time],['Available stock',p.isDemo?'—':p.stock+' '+p.unit+(p.stock===1?'':'s')]].filter(x=>x[1]);
  const imgs=p.images.length?p.images:[null];
  const related=products.filter(x=>x.id!==p.id&&x.category===p.category&&!x.isDemo===!p.isDemo).slice(0,6);
  page.innerHTML=
  '<div class="crumb"><a href="index.html">Home</a> › <a href="index.html?cat='+encodeURIComponent(p.category)+'">'+esc(p.category)+'</a> › '+esc(p.title)+'</div>'+
  '<section class="pg"><div class="gal"><div class="thumbs" id="thumbs">'+(p.images.length>1?imgs.map((u,i)=>'<button data-i="'+i+'" class="'+(i?'':'on')+'"><img src="'+esc(u)+'" alt=""></button>').join(''):'')+'</div><div class="big" id="big">'+(p.images[0]?'<img src="'+esc(p.images[0])+'" alt="'+esc(p.title)+'">':esc(p.icon))+'</div></div>'+
  '<div class="info"><h1>'+esc(p.title)+'</h1>'+(p.isDemo?'<div class="note warn"><b>DEMO PREVIEW · NOT FOR SALE</b><br>This sample listing is for display only and cannot be ordered.</div>':'')+
  '<div class="pricebox"><span class="now">'+money(p.price_bdt)+'</span>'+(d?'<s>'+money(p.compare_at_bdt)+'</s> <span class="off" style="position:static">-'+d+'%</span>':'')+'<small>Price per '+esc(p.unit)+(p.isDemo?' (sample)':'')+' · Min. order '+p.min+' '+esc(p.unit)+(p.min>1?'s':'')+'</small></div>'+
  '<dl class="kv">'+details.map(x=>'<dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl>'+
  (ok?'<div class="qrow"><b>Quantity</b><div class="qty"><button id="qm" aria-label="Decrease">−</button><span id="qv">'+p.min+'</span><button id="qp" aria-label="Increase">+</button></div><span class="muted" id="qsub"></span></div>':'')+
  '<div class="acts">'+(ok?'<button class="btn pri" id="orderNow">Order now</button><button class="btn out" id="addCart">Add to cart</button>':'<button class="btn" disabled>'+(p.isDemo?'Preview only':'Out of stock')+'</button>')+'<a class="btn wa" id="waBtn" target="_blank" rel="noopener">💬 WhatsApp</a></div>'+
  '<p class="muted" style="margin-top:12px">🛡️ Order protection · seller confirms your order · Cash on Delivery available</p></div>'+
  '<aside class="supc"><h3>Supplier</h3><div><span class="vf">Verified</span> <b>'+esc(p.shop)+'</b></div>'+(p.shopCity?'<div class="muted">📍 '+esc(p.shopCity)+', Bangladesh</div>':'')+'<div class="muted">Orders are confirmed by the seller and delivered with live status updates.</div><a class="btn wa" id="waSup" target="_blank" rel="noopener">Chat with us</a><a class="btn out" href="track.html">Track an order</a></aside></section>'+
  '<div class="tabs"><button class="on" data-tab="ov">Description</button>'+(specs.length?'<button data-tab="sp">Specifications</button>':'')+'</div>'+
  '<section class="panel" id="tab-ov"><p style="white-space:pre-wrap;margin:0">'+esc(p.description||'Quality product from a verified SUHAS E-COM seller.')+'</p></section>'+
  (specs.length?'<section class="panel hidden" id="tab-sp"><table class="spec"><tbody>'+specs.map(s=>'<tr><th>'+esc(s.k)+'</th><td>'+esc(s.v||'')+'</td></tr>').join('')+'</tbody></table></section>':'')+
  (related.length?'<div class="sec" style="margin-top:24px"><h2>More from this category</h2></div><div class="grid" id="rel">'+related.map(cardHtml).join('')+'</div>':'');
  let qty=p.min;
  const msg=()=>waLink('Hello SUHAS E-COM, I want to order:\n'+p.title+'\nQuantity: '+qty+' '+p.unit+'\nPrice: '+money(p.price_bdt)+' each\n'+url);
  const sync=()=>{if($('qv')){$('qv').textContent=qty;$('qsub').textContent='Total '+money(qty*p.price_bdt)}$('waBtn').href=msg();$('waSup').href=msg()};sync();
  if(ok){
    $('qm').onclick=()=>{qty=Math.max(p.min,qty-1);sync()};$('qp').onclick=()=>{qty=Math.min(p.stock,qty+1);sync()};
    $('orderNow').onclick=()=>openCheckout([{id:p.id,qty}]);
    $('addCart').onclick=()=>{if(addToCart(p.id,qty)){document.getElementById('cartBtn').click()}};
  }
  $('thumbs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;$('big').innerHTML='<img src="'+esc(p.images[i])+'" alt="">';[...$('thumbs').children].forEach((x,k)=>x.classList.toggle('on',k===i))});
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('tab-ov').classList.toggle('hidden',b.dataset.tab!=='ov');if($('tab-sp'))$('tab-sp').classList.toggle('hidden',b.dataset.tab!=='sp')});
}
watchMyOrders();
</script>
</body>
</html>
