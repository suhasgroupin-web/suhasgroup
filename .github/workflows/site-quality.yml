name: Site quality checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check inline JavaScript and local HTML links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import subprocess
          import sys

          root = Path(".").resolve()
          errors = []

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.scripts = []
                  self.in_script = False
                  self.script_type = ""
                  self.script_src = ""

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for attr in ("href", "src", "action"):
                      value = attrs.get(attr)
                      if value:
                          self.refs.append((tag, attr, value))
                  if tag == "script":
                      self.in_script = True
                      self.script_type = attrs.get("type", "").lower()
                      self.script_src = attrs.get("src", "")

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_script = False
                      self.script_type = ""
                      self.script_src = ""

              def handle_data(self, data):
                  if self.in_script and not self.script_src and self.script_type not in ("application/ld+json", "application/json", "importmap"):
                      self.scripts.append(data)

          pages = sorted(root.rglob("*.html"))
          for page in pages:
              parser = PageParser()
              try:
                  source = page.read_text(encoding="utf-8")
                  parser.feed(source)
              except Exception as exc:
                  errors.append(f"{page}: cannot parse HTML: {exc}")
                  continue

              for tag, attr, raw in parser.refs:
                  value = raw.strip()
                  if not value or value.startswith(("#", "//", "data:", "mailto:", "tel:", "javascript:")):
                      continue
                  parsed = urlsplit(value)
                  if parsed.scheme or parsed.netloc:
                      continue
                  target = (root / parsed.path.lstrip("/")).resolve() if parsed.path.startswith("/") else (page.parent / parsed.path).resolve()
                  if not parsed.path:
                      continue
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.exists():
                      errors.append(f"{page}: broken local {attr}={value}")

              for index, script in enumerate(parser.scripts, 1):
                  if not script.strip():
                      continue
                  result = subprocess.run(
                      ["node", "--check"],
                      input=script,
                      text=True,
                      capture_output=True,
                  )
                  if result.returncode:
                      errors.append(f"{page}: inline script {index} syntax error: {result.stderr.strip()}")

          if errors:
              print("\\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(pages)} HTML pages: inline JavaScript syntax and local links are clean.")
          PY
