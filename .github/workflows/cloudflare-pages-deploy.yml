name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Cloudflare Pages production branches
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for project in suhasgroup suhasmax; do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project")
            branch=$(printf '%s' "$response" | jq -er '.result.production_branch')
            echo "${project}_branch=$branch" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages project $project production branch: $branch"
          done
      - name: Generate required 512px SUHAS MAX PNG install icon
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert assets/suhas-max-icon-192.png -filter Lanczos -resize 512x512\! PNG32:assets/suhas-max-icon-512.png
          identify -format '%wx%h %m\\n' assets/suhas-max-icon-512.png
      - name: Prepare separate E-COM and SUHAS MAX site roots
        run: |
          set -euo pipefail
          mkdir -p /tmp/suhasgroup-site
          cp -a . /tmp/suhasgroup-site/
          cat > /tmp/suhasgroup-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=/apps/suhas-ecom/index.html">
            <link rel="canonical" href="https://suhasgroup.pages.dev/apps/suhas-ecom/index.html">
            <title>SUHAS E-COM</title>
          </head>
          <body>
            <p>Opening <a href="/apps/suhas-ecom/index.html">SUHAS E-COM marketplace</a>…</p>
            <script>location.replace('/apps/suhas-ecom/index.html')</script>
          </body>
          </html>
          EOF
      - name: Deploy SUHAS E-COM to suhasgroup.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/suhasgroup-site --project-name=suhasgroup --branch=${{ steps.pages.outputs.suhasgroup_branch }}
      - name: Deploy SUHAS MAX to suhasmax.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=suhasmax --branch=${{ steps.pages.outputs.suhasmax_branch }}
      - name: Configure SUHAS E-COM confirmation email secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          set -euo pipefail
          if [ -z "$EMAIL_API_TOKEN" ] || [ -z "$EMAIL_FROM" ]; then
            echo "Email sending secrets are not configured; skipping optional email setup."
            exit 0
          fi
          printf '%s' "$EMAIL_API_TOKEN" | npx --yes wrangler@4 pages secret put CLOUDFLARE_EMAIL_API_TOKEN --project-name=suhasgroup
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 pages secret put CLOUDFLARE_ACCOUNT_ID --project-name=suhasgroup
          printf '%s' "$EMAIL_FROM" | npx --yes wrangler@4 pages secret put EMAIL_FROM --project-name=suhasgroup
