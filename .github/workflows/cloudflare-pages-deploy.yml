name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Cloudflare Pages production branches
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for project in suhasgroup suhasmax; do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project")
            branch=$(printf '%s' "$response" | jq -er '.result.production_branch')
            echo "${project}_branch=$branch" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages project $project production branch: $branch"
          done
      - name: Generate required 512px SUHAS MAX PNG install icon
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert assets/suhas-max-icon-192.png -filter Lanczos -resize 512x512\! PNG32:assets/suhas-max-icon-512.png
          identify -format '%wx%h %m\\n' assets/suhas-max-icon-512.png
      - name: Generate 512px E-COM install icon
        run: |
          set -euo pipefail
          convert apps/suhas-ecom/logo.png -filter Lanczos -resize 512x512\! PNG32:apps/suhas-ecom/logo-512.png
      - name: Build separate site roots (E-COM and SUHAS GROUP)
        run: bash scripts/build-sites.sh /tmp/suhas-sites
      - name: Deploy SUHAS E-COM to suhasmax.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: /tmp/suhas-sites/ecom
          command: pages deploy . --project-name=suhasmax --branch=${{ steps.pages.outputs.suhasmax_branch }}
      - name: Deploy SUHAS GROUP apps to suhasgroup.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: /tmp/suhas-sites/group
          command: pages deploy . --project-name=suhasgroup --branch=${{ steps.pages.outputs.suhasgroup_branch }}
      - name: Configure SUHAS E-COM confirmation email secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          set -euo pipefail
          if [ -z "$EMAIL_API_TOKEN" ] || [ -z "$EMAIL_FROM" ]; then
            echo "Email sending secrets are not configured; skipping optional email setup."
            exit 0
          fi
          printf '%s' "$EMAIL_API_TOKEN" | npx --yes wrangler@4 pages secret put CLOUDFLARE_EMAIL_API_TOKEN --project-name=suhasmax
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 pages secret put CLOUDFLARE_ACCOUNT_ID --project-name=suhasmax
          printf '%s' "$EMAIL_FROM" | npx --yes wrangler@4 pages secret put EMAIL_FROM --project-name=suhasmax
