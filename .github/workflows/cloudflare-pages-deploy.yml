name: Deploy SUHAS GROUP to Cloudflare Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-group
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and validate SUHAS GROUP site
        run: bash scripts/build-sites.sh /tmp/suhas-group-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read SUHAS GROUP Cloudflare Pages production branch
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/suhasgroup")
          branch=$(printf '%s' "$response" | jq -er '.result.production_branch')
          echo "production_branch=$branch" >> "$GITHUB_OUTPUT"
          echo "SUHAS GROUP production branch: $branch"
      - name: Build SUHAS GROUP publish folder
        run: bash scripts/build-sites.sh /tmp/suhas-group-site
      - name: Deploy SUHAS GROUP to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: /tmp/suhas-group-site
          command: pages deploy . --project-name=suhasgroup --branch=${{ steps.pages.outputs.production_branch }}
      - name: Verify deployed SUHAS GROUP homepage
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://suhasgroup.pages.dev/ -o /tmp/suhas-group-live.html; then
              grep -qi 'SUHAS GROUP' /tmp/suhas-group-live.html
              ! grep -Eiq 'Shop Products|Suhas E-Com' /tmp/suhas-group-live.html
              echo "SUHAS GROUP live homepage verified."
              exit 0
            fi
            sleep 5
          done
          echo "Could not verify SUHAS GROUP live homepage after deployment."
          exit 1
