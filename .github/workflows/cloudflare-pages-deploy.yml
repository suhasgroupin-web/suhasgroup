name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Cloudflare Pages production branch
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/suhasgroup")
          branch=$(printf '%s' "$response" | jq -er '.result.production_branch')
          echo "Cloudflare Pages production branch: $branch"
          echo "production_branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Deploy static SUHAS-MAX site to Cloudflare Pages production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=suhasgroup --branch=${{ steps.pages.outputs.production_branch }}
      - name: Configure SUHAS E-COM confirmation email secrets
        if: ${{ env.EMAIL_API_TOKEN != '' && env.EMAIL_FROM != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          set -euo pipefail
          printf '%s' "$EMAIL_API_TOKEN" | npx --yes wrangler@4 pages secret put CLOUDFLARE_EMAIL_API_TOKEN --project-name=suhasgroup
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 pages secret put CLOUDFLARE_ACCOUNT_ID --project-name=suhasgroup
          printf '%s' "$EMAIL_FROM" | npx --yes wrangler@4 pages secret put EMAIL_FROM --project-name=suhasgroup
