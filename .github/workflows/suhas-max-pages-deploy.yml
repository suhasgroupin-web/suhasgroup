name: Deploy SUHAS MAX standalone to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - suhas-max/standalone-product-20261114
    paths:
      - "apps/suhas-max-standalone/**"
      - ".github/workflows/suhas-max-pages-deploy.yml"

permissions:
  contents: read

concurrency:
  group: suhas-max-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SUHAS MAX branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create the separate Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Create only when missing; tolerate "already exists" (code 8000002).
          if ! output=$(wrangler pages project create suhasmax --production-branch suhas-max/standalone-product-20261114 2>&1); then
            echo "$output"
            echo "$output" | grep -q "already exists" || exit 1
            echo "Pages project suhasmax already exists - continuing."
          else
            echo "$output"
          fi
      - name: Deploy only the standalone SUHAS MAX app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler pages deploy apps/suhas-max-standalone --project-name=suhasmax --branch=suhas-max/standalone-product-20261114
